[project]
name = "ottomeant"
version = "0.2.0"
description = "Build-time Arabic root morphology for a static Turkish website"
requires-python = ">=3.11"
dependencies = []

[tool.uv]
package = false
cache-dir = ".cache/uv"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[dependency-groups]
dev = [
    "ruff>=0.17.1",
    "ty>=0.0.89",
]
